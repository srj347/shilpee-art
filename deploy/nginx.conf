# /etc/nginx/sites-available/shilpee
# Plain HTTP on purpose: run Certbot after this, and it adds HTTPS and the http -> https redirect:
#   sudo certbot --nginx -d shilpeemaitra.com -d www.shilpeemaitra.com --redirect

server {
  listen 80;
  listen [::]:80;
  server_name shilpeemaitra.com www.shilpeemaitra.com;

  # Photos are uploaded through here (up to 30 MB each).
  client_max_body_size 32m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Next.js build files never change once built.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # image processing can take a few seconds
  }
}
