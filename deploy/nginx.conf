# /etc/nginx/sites-available/shilpee
# Plain HTTP on purpose: run Certbot after this, and it adds HTTPS and the http -> https redirect:
#   sudo certbot --nginx -d shilpeemaitra.com -d www.shilpeemaitra.com --redirect

server {
  listen 80;
  listen [::]:80;
  server_name shilpeemaitra.com www.shilpeemaitra.com;

  # Photos are uploaded through here (up to 30 MB each).
  client_max_body_size 32m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Images, straight from disk (STORAGE_DRIVER=local, STORAGE_DIR=/srv/shilpee-media).
  # Only the public sizes are served; the originals in /srv/shilpee-media/private never are.
  # File names never change once written, so browsers may keep them for a year.
  location /media/img/ {
    alias /srv/shilpee-media/public/img/;
    types {
      image/avif avif;
      image/webp webp;
      image/jpeg jpg;
    }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    access_log off;
    try_files $uri =404;
  }

  # Anything else under /media is not a public file.
  location /media/ {
    return 404;
  }

  # Next.js build files never change once built.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # image processing can take a few seconds
  }
}
